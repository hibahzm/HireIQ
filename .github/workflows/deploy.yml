name: Deploy

# Builds and pushes the three service images to Docker Hub on every merge to
# main, then performs a rolling update of the Azure Container Apps. `api` and
# `frontend` have external ingress; `agents` is internal-only.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKERHUB_NAMESPACE
#   AZURE_CREDENTIALS         (service principal JSON for azure/login)
#   AZURE_RESOURCE_GROUP
#   ACA_API_APP, ACA_AGENTS_APP, ACA_FRONTEND_APP   (Container App names)
#   FRONTEND_VITE_API_URL     (public API URL baked into the frontend, e.g. https://<api-fqdn>)
#   FRONTEND_VITE_WS_URL      (public WS URL, e.g. wss://<api-fqdn>)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: backend
          - service: agents
            context: agents
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          # The frontend bakes the API/WS URL at build time (Vite). These args are
          # ignored by the api/agents Dockerfiles, which don't declare them.
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_VITE_API_URL }}
            VITE_WS_URL=${{ secrets.FRONTEND_VITE_WS_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/hireiq-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_NAMESPACE }}/hireiq-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Rolling Update (Azure Container Apps)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update agents (internal) first
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.ACA_AGENTS_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.DOCKERHUB_NAMESPACE }}/hireiq-agents:${{ env.IMAGE_TAG }}

      - name: Update api
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.ACA_API_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.DOCKERHUB_NAMESPACE }}/hireiq-api:${{ env.IMAGE_TAG }}

      - name: Update frontend
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.ACA_FRONTEND_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.DOCKERHUB_NAMESPACE }}/hireiq-frontend:${{ env.IMAGE_TAG }}

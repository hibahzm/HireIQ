name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hireiq
          POSTGRES_PASSWORD: hireiq_dev
          # conftest connects to this maintenance DB (admin-user name by default),
          # then creates `hireiq_test` on top of it.
          POSTGRES_DB: hireiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://hireiq:hireiq_dev@localhost:5432/hireiq_test
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BACKEND: local
          STORAGE_LOCAL_PATH: /tmp/hireiq_storage
          EMAIL_BACKEND: console
          JWT_SECRET: ci-test-secret
          AGENTS_INTERNAL_SECRET: ci-internal-secret
          AGENTS_BASE_URL: http://localhost:8001
          OPENAI_API_KEY: sk-fake-for-tests

  agents-lint-test:
    name: Agents — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: pytest tests/ -v
        env:
          OPENAI_API_KEY: sk-fake-for-tests
          AGENTS_INTERNAL_SECRET: ci-internal-secret

  frontend-typecheck-build:
    name: Frontend — Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  frontend-a11y:
    name: Frontend — Accessibility (axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Accessibility audit (WCAG 2.1 AA)
        run: npm run test:a11y

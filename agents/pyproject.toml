[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hireiq-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "langgraph==0.2.56",
    "langchain-openai==0.2.12",
    "openai==1.56.2",
    "structlog==24.4.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "hvac==2.3.0",
    "azure-identity==1.19.0",
    "httpx==0.28.0",
    # 2.x exposes langfuse.callback.CallbackHandler used by app/observability.py;
    # 3.x changed that API. Keep on the 2.x line to match langchain 0.3 / langgraph 0.2.
    "langfuse>=2.39,<3.0",
    # langfuse 2.x's langchain CallbackHandler imports from the `langchain` umbrella
    # package (not just langchain-core), so it must be installed for tracing to work.
    "langchain>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
    "ruff==0.8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

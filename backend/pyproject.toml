[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hireiq-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "httpx==0.28.0",
    "redis[asyncio]==5.2.0",
    "azure-storage-blob==12.23.1",
    "aiohttp==3.14.1",
    "PyMuPDF==1.24.13",
    "python-docx==1.1.2",
    "azure-ai-formrecognizer==3.3.3",
    "azure-cognitiveservices-speech==1.41.1",
    "openai==1.56.2",
    "azure-identity==1.19.0",
    "azure-keyvault-secrets==4.9.0",
    "hvac==2.3.0",
    "structlog==24.4.0",
    "pydantic-settings==2.6.1",
    "pgvector==0.3.5",
    "resend==2.4.0",
    "apscheduler==3.10.4",
    "python-multipart==0.0.18",
    "tiktoken==0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
    "ruff==0.8.3",
    "ragas==0.2.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 line length is enforced by the formatter; B904/SIM117 and the SIM10x
# simplify-style rules are pervasive pre-existing choices deferred to a cleanup.
ignore = ["E501", "B904", "SIM117", "SIM105", "SIM102", "SIM103"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Form()/... in argument defaults are the framework
# idiom, not the B008 mutable-default anti-pattern.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
    "fastapi.Header", "fastapi.Path", "fastapi.Cookie", "fastapi.Body", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationships use string forward-refs (Mapped["Model"]) to avoid
# circular imports — ruff can't resolve them (false-positive F821).
"app/models/*" = ["F821"]
# Alembic env imports all models via star for autogenerate.
"alembic/*" = ["F403", "F405", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

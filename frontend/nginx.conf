server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. It's used only by the /api + /ws proxy below, which
    # is the LOCAL docker-compose path (frontend and api on one network). Naming
    # the upstream through a variable makes nginx resolve it LAZILY at request
    # time instead of at startup — so the container still boots on Azure
    # Container Apps, where no host called `api` exists and the browser calls the
    # API directly via the VITE_API_URL baked into the bundle (these blocks unused).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API proxy — strip the /api prefix before forwarding (local docker-compose only)
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for interview room (local docker-compose only)
    location /ws/ {
        set $ws_upstream http://api:8000;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

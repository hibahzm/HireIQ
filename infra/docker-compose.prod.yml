# Production composition — reference topology for Azure Container Apps.
# Pulls pre-built images from Docker Hub (no source bind-mounts, no --reload).
# `api` and `frontend` have external ingress; `agents` is internal-only.
#
# SECRETS: production does NOT use HashiCorp Vault or an .env file. With
# ENV=production, config.py loads every secret from **Azure Key Vault** via
# DefaultAzureCredential (config._load_from_azure_keyvault). On Azure Container
# Apps the container's **managed identity** is granted Key Vault access, so no
# credentials are passed here. The only env below is non-secret configuration
# plus the Key Vault URL.
#
# Secrets resolved from Key Vault (set with `az keyvault secret set`):
#   api    : openai-api-key, jwt-secret, agents-internal-secret, database-url,
#            redis-url, email-api-key, azure-storage-connection-string
#   agents : openai-api-key, agents-internal-secret, azure-speech-key
#
# For LOCAL testing of this file (outside ACA), DefaultAzureCredential needs
# AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET (a service principal)
# or a mounted `az login` — it cannot use a managed identity off-Azure.
#
# Required env for substitution: DOCKERHUB_NAMESPACE, IMAGE_TAG,
# AZURE_KEYVAULT_URL, FRONTEND_ORIGIN, EMAIL_FROM.
services:
  api:
    image: ${DOCKERHUB_NAMESPACE}/hireiq-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: production
      AZURE_KEYVAULT_URL: ${AZURE_KEYVAULT_URL}
      AGENTS_BASE_URL: http://agents:8001
      STORAGE_BACKEND: azure
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-hireiq}
      EMAIL_BACKEND: resend
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      - agents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agents:
    image: ${DOCKERHUB_NAMESPACE}/hireiq-agents:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Internal-only: no `ports:` mapping — agents is never publicly reachable.
    expose:
      - "8001"
    environment:
      ENV: production
      AZURE_KEYVAULT_URL: ${AZURE_KEYVAULT_URL}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/hireiq-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

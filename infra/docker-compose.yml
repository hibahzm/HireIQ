services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hireiq
      POSTGRES_PASSWORD: hireiq_dev
      POSTGRES_DB: hireiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: hireiq-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev

  # ── One-shot init containers — run at startup, then exit ──────────────────
  # Seed dev Vault with secrets from infra/.env, then exit. api/agents wait for
  # this to complete before starting (they read secrets from Vault on boot).
  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: hireiq-dev-token
    volumes:
      - ./scripts/init-vault.sh:/init/init-vault.sh:ro
    entrypoint: ["/bin/sh", "/init/init-vault.sh"]
    restart: "no"

  # Run Alembic migrations to head, then exit. api waits for completion.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://hireiq:hireiq_dev@postgres:5432/hireiq
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: hireiq-dev-token
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hireiq:hireiq_dev@postgres:5432/hireiq
      REDIS_URL: redis://redis:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: hireiq-dev-token
      AGENTS_BASE_URL: http://agents:8001
      AGENTS_INTERNAL_SECRET: dev-internal-secret
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      EMAIL_BACKEND: console
      EMAIL_FROM: noreply@hireiq.local
    volumes:
      - ../backend:/app
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  agents:
    build:
      context: ../agents
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: hireiq-dev-token
      AGENTS_INTERNAL_SECRET: dev-internal-secret
    volumes:
      - ../agents:/app
    depends_on:
      vault-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  api_storage:
